# CI: runs on every push to main and every pull request.
# It repeats the same checks you run locally, but on a clean GitHub-hosted machine,
# so "it works on my laptop" is never the only proof.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you trigger a run manually from the Actions tab

# Cancel an older run if you push again to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow can only read the repo
permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag; Dependabot bumps this
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag; Dependabot bumps this
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run pytest
        run: uv run pytest

  container:
    name: Container (arm64)
    # AgentCore Runtime requires linux/arm64; build on a native ARM runner (free for
    # public repositories) and smoke-test the image before anything is deployed.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --platform linux/arm64 -t finsight-api:ci .
      - name: Start container
        run: docker run -d --name finsight -p 8080:8080 finsight-api:ci
      - name: Health check (/ping)
        run: |
          for i in $(seq 1 30); do
            if curl -sf localhost:8080/ping | grep -q Healthy; then
              curl -s localhost:8080/ping; exit 0
            fi
            sleep 1
          done
          docker logs finsight; exit 1
      - name: Image size
        run: docker image ls finsight-api:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
