[project]
name = "finsight"
version = "0.1.0"
description = "FinSight: an AI research analyst agent for financial filings and market data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
finsight = "finsight.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

# ---------- Tool configuration ----------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused imports, undefined names), I: import sorting,
# B: common bug patterns, UP: modern Python syntax, SIM: simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=finsight --cov-report=term-missing"
