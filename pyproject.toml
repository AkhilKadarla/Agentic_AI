[project]
name = "finsight"
version = "0.1.0"
description = "FinSight: an AI research analyst agent for financial filings and market data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=1.15.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.149.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "mcp>=2.3.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
finsight = "finsight.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
cloud = [
    "aws-opentelemetry-distro>=0.21.0",
]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "watchdog>=6.0.0",
]
reports = [
    "pdfplumber>=0.11.10",
]
ui = [
    "altair>=6.3.0",
    "streamlit>=1.66.0",
]

# ---------- Tool configuration ----------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused imports, undefined names), I: import sorting,
# B: common bug patterns, UP: modern Python syntax, SIM: simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=finsight --cov-report=term-missing"

[tool.uv]
# Local `uv sync` installs the UI and the PDF tools too; the API container uses
# `--no-default-groups` so Streamlit and pdfplumber stay out of the image (it only reads
# the key metrics file that `finsight pillar3` builds).
default-groups = ["dev", "reports", "ui"]
