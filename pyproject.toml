[project]
name = "finsight"
version = "0.1.0"
description = "FinSight: an AI research analyst agent for financial filings and market data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=1.8.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
finsight = "finsight.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "watchdog>=6.0.0",
]
ui = [
    "altair>=6.3.0",
    "streamlit>=1.64.0",
]

# ---------- Tool configuration ----------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused imports, undefined names), I: import sorting,
# B: common bug patterns, UP: modern Python syntax, SIM: simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=finsight --cov-report=term-missing"

[tool.uv]
# Local `uv sync` installs the UI too; the API container uses `--no-default-groups`
# so Streamlit and its dependencies stay out of the image.
default-groups = ["dev", "ui"]
